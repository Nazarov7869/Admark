<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admark - Rasmlar Dasturi</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>Siz yuborgan rasmlar asosidagi dastur</h1>
        <p>
          Quyidagi galereya siz yuklagan banner va reklama rasmlarini qulay ko‘rish,
          qidirish hamda kattalashtirib ko‘rish uchun tayyorlandi.
        </p>
        <input id="search" type="search" placeholder="Rasm nomi bo‘yicha qidiring..." />
      </header>

      <section id="gallery" class="gallery" aria-live="polite"></section>
    </main>

    <dialog id="viewer" class="viewer">
      <button id="closeViewer" class="close" aria-label="Yopish">✕</button>
      <img id="viewerImage" src="" alt="Katta ko‘rinish" />
      <p id="viewerCaption"></p>
      <div class="controls">
        <button id="prevBtn">Oldingi</button>
        <button id="nextBtn">Keyingi</button>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
